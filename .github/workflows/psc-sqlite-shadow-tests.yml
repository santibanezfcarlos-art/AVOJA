name: PSC - test dormant SQLite migration endpoint

on:
  pull_request:
    paths:
      - 'psicologia-api/psc_holds_sqlite.py'
      - 'psicologia-api/psc_migration_internal.py'
      - 'psicologia-api/test_psc_migration_internal.py'
      - '.github/workflows/psc-sqlite-shadow-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'Flask>=3.1,<4'
      - run: python -m unittest discover -s psicologia-api -p 'test_psc_migration_internal.py' -v
