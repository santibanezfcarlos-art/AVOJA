name: Verificar correo corporativo de boletas
on:
  push:
    branches: [feature/psc-sii-email-pdf-20261029]
  pull_request:
    branches: [psicologia-webpay-produccion-preparacion]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r psicologia-api/requirements.txt
      - run: python -m compileall -q psicologia-api
      - run: cd psicologia-api && python -m unittest -v test_receipt_pilot
