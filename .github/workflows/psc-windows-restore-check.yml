name: PSC - Validate local native restore helper

on:
  pull_request:
    paths:
      - 'psicologia-api/tools/psc_windows_native_restore.ps1'
      - '.github/workflows/psc-windows-restore-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parse-powershell:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify syntax and isolation flags
        shell: pwsh
        run: |
          $path = 'psicologia-api/tools/psc_windows_native_restore.ps1'
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path).Path, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
          $source = Get-Content $path -Raw
          if (-not $source.Contains('--network none')) { throw 'Missing network isolation' }
          if (-not $source.Contains('docker rm --force --volumes')) { throw 'Missing cleanup' }
          if (-not $source.Contains('Get-FileHash')) { throw 'Missing SHA256 check' }
          'PSC_POWERSHELL_PARSE_OK'

  container-prerequisites:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check official PostgreSQL 18 container includes tools
        run: |
          docker pull postgres:18-bookworm
          docker run --rm --network none postgres:18-bookworm sh -ec 'command -v openssl; command -v pg_restore; command -v createdb; command -v pg_isready'
