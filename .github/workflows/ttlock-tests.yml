name: TTLock offline tests

on:
  push:
    branches: [ttlock-integration]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline unittest suite
        working-directory: valhalla
        run: python -m unittest -v test_ttlock_daily test_ttlock_worker
