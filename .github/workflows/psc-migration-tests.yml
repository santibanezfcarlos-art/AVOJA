name: PSC - Verify migration utilities

on:
  pull_request:
    paths:
      - "psicologia-api/tools/psc_*.py"
      - "psicologia-api/tools/psc_render_shell_audit.sh"
      - "psicologia-api/tools/psc_render_stage_backup.py"
      - "psicologia-api/tools/test_psc_*.py"
      - ".github/workflows/psc-migration-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-offline:
    name: Unit tests - no access to production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate Render shell helper syntax
        run: bash -n psicologia-api/tools/psc_render_shell_audit.sh
      - name: Compile migration utilities (no production connections)
        run: python -m compileall -q psicologia-api/tools/psc_*.py
      - name: Run isolated tests (stdlib only)
        run: python -m unittest discover -s psicologia-api/tools -p 'test_psc_*.py' -v
